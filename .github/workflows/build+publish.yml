name: "Build and Publish"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build with Gradle
        id: build
        run: chmod +x gradlew && ./gradlew build

      - name: Find correct JAR
        id: findjar
        run: |
          output="$(find build/libs/ ! -name "*-dev.jar" ! -name "*-sources.jar" -type f -printf "%f\n")"
          echo "jarname=$output" >> "$GITHUB_OUTPUT"

      - name: Check gh CLI version
        run: gh --version

      - name: Create or Update Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release exists, updating title and notes..."
            gh release edit "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "Automated release"
          else
            echo "Release does not exist, creating..."
            gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "Automated release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to the GitHub release
        run: |
          gh release upload "${{ github.ref_name }}" "build/libs/${{ steps.findjar.outputs.jarname }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: build/libs/${{ steps.findjar.outputs.jarname }}
          name: (mc 1.19-1.19.2) No Pause ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog: "Automated release"
          relations: P7dR8mSH:required
          game_versions: 1.19,1.19.1,1.19.2
          release_type: release
          loaders: fabric
          featured: false
          project_id: KmtdQm2A