name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  # -------------------------------
  # Normal build job for pushes and PRs
  # -------------------------------
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java: [17]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: List build output
        run: ls -R build/

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  # -------------------------------
  # Release build and upload to Modrinth
  # -------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Find normal jar file
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: "nopause"
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog: "Automated build from GitHub Actions."
          file_path: build/libs/*.jar
          game_versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
          loaders: |
            fabric
          featured: false
