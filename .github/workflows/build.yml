name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  # -------------------------------
  # Normal build job for pushes and PRs
  # -------------------------------
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java: [17]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  # -------------------------------
  # Release build and upload to Modrinth
  # -------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: "nopause"          # <<< CHANGE THIS
          version_name: ${{ github.ref_name }}
          version_number: ${{ github.ref_name }}
          changelog: "Automated build from GitHub Actions."
          files: |
            build/libs/*.jar
          game_versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
          loaders: |
            fabric